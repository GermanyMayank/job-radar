name: job-radar

on:
  schedule:
    - cron: "30 4 * * *"     # 06:30 German summer time / 05:30 winter time
  workflow_dispatch:          # "Run workflow" button for on-demand runs

permissions:
  contents: write             # lets the job commit results back to the repo

concurrency: job-radar

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run radar
        run: python run.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      - name: Commit results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data SHORTLIST.md
          git diff --staged --quiet || git commit -m "radar: $(date -u +%F)"
          git pull --rebase --autostash
          git push
