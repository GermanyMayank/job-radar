  - primavera
  - pvsyst
  - helioscope
  - autocad
  - sap
  - power bi
  - excel
  - sharepoint
  - sitetracker
  - bom
  - boq
  - stückliste
  - single line
  - einlinienschaltbild
  - netzanschluss
  - grid connection
  - inbetriebnahme
  - commissioning
  - procurement
  - einkauf
  - beschaffung
  - subcontractor
  - nachunternehmer
  - qa/qc
  - hse
  - risk register
  - change order
  - nachtrag
  - netzbetreiber
  - grid operator
  - pumpe
